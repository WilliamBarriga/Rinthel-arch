<!doctype html>
<!--
  PROTOTIPO DESECHABLE (ticket "Estetica del chrome de la UI", #177). No es codigo de produccion.
  Elegido: variante G (Islas: muelle) con paleta neon, en oscuro (?variant=G&paleta=neon).
  Pregunta: que lenguaje visual tiene el chrome de la UI de dev para que no se vea plano ni anticuado.
  La disposicion es la F aprobada en #169 y es identica en todas las variantes; solo cambia la estetica:
  profundidad, tipografia y densidad, color (claro / oscuro), movimiento y tratamiento del color del agente.
  Variantes conmutables con ?variant=A|B|C|D y la barra flotante (flechas o teclas). Claro / oscuro con ?modo= o el boton de la barra.
  CSS a mano que imita lo que darian shadcn/ui + Tailwind (tokens en .ui-chrome, no en :root), sin dependencias.
  Servir desde la raiz del repo (el lienzo usa capturas de docs/img). Todo en memoria; nada escribe.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>PROTOTIPO - Estetica del chrome de la UI de dev</title>
<style>
/* ======================= Estructura comun (disposicion F) ======================= */
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:#000; }
.ui-chrome { position:fixed; inset:0; display:grid; grid-template-rows:var(--alto-barra) 1fr; background:var(--fondo); color:var(--texto);
  font-family:var(--fuente); font-size:var(--tam); line-height:1.45; transition:grid-template-columns var(--dur) var(--curva), background var(--dur); }
.ui-chrome * { transition-property:background-color, border-color, color, box-shadow, opacity, transform; transition-duration:var(--dur-corta); transition-timing-function:var(--curva); }
.barra { grid-row:1; grid-column:1/-1; display:flex; align-items:center; gap:12px; padding:0 12px; min-width:0; }
.marca { display:flex; align-items:center; gap:8px; font-weight:600; white-space:nowrap; }
.marca i { width:18px; height:18px; display:block; }
.busq { flex:0 1 380px; display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--tenue); padding:0 10px; height:30px; }
.busq kbd, kbd { margin-left:auto; font:11px var(--mono); padding:1px 5px; color:var(--tenue); }
.flex1 { flex:1; }
.seguir { display:flex; align-items:center; gap:8px; cursor:pointer; white-space:nowrap; user-select:none; }
.interruptor { width:30px; height:17px; border-radius:99px; position:relative; background:var(--sutil-2); }
.interruptor::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform var(--dur-corta) var(--curva); box-shadow:0 1px 2px #0004; }
.seguir.on .interruptor { background:var(--agente); }
.seguir.on .interruptor::after { transform:translateX(13px); }
.ultimo { font:11.5px var(--mono); color:var(--agente-texto); max-width:360px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; display:flex; align-items:center; gap:6px; }
.punto { width:7px; height:7px; border-radius:50%; background:var(--agente); flex:none; }
.punto.vivo { animation:latido 1.6s infinite; }
@keyframes latido { 0%{ box-shadow:0 0 0 0 var(--agente-halo);} 70%{ box-shadow:0 0 0 7px transparent;} }
.btn-modo { cursor:pointer; padding:4px 8px; color:var(--tenue); }

.c1 { grid-column:1; } .c2 { grid-column:2; } .c3 { grid-column:3; } .c4 { grid-column:4; } .c5 { grid-column:5; }
.hueco { grid-row:2; }
.panel { grid-row:2; display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
.cuerpo { overflow:auto; flex:1; min-height:0; }
.asa { grid-row:2; cursor:col-resize; position:relative; }
.asa::after { content:''; position:absolute; inset:0 2px; border-radius:2px; }
.asa:hover::after { background:var(--acento); opacity:.6; }
.oculta { grid-row:2; cursor:pointer; writing-mode:vertical-rl; padding:10px 0; font-size:11px; color:var(--tenue); display:flex; align-items:center; justify-content:flex-start; }
.oculta:hover { color:var(--texto); }

.tabs { display:flex; align-items:center; gap:2px; padding:0 6px; flex:none; position:relative; overflow-x:auto; scrollbar-width:none; }
.tab { cursor:pointer; padding:0 10px; height:34px; display:flex; align-items:center; gap:6px; color:var(--tenue); white-space:nowrap; position:relative; }
.tab:hover { color:var(--texto); }
.tab.sel { color:var(--texto); }
.tab.icono { padding:0 8px; }
.cnt { font:10.5px var(--mono); padding:0 5px; border-radius:99px; background:var(--sutil); color:var(--tenue); line-height:16px; }
.cnt.agente { background:var(--agente-suave); color:var(--agente-texto); }
.cnt.warn { background:var(--warn-suave); color:var(--warn); }

.grupo { padding:14px 14px 4px; font-size:11px; color:var(--tenue); display:flex; gap:6px; align-items:center; }
.item { margin:1px 6px; padding:5px 8px; display:flex; align-items:center; gap:8px; cursor:pointer; position:relative; }
.item .nom { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item:hover { background:var(--hover); }
.item.sel { background:var(--sel); color:var(--texto-fuerte); }
.item.toca { box-shadow:inset 2px 0 0 var(--agente); }
.glifo { width:14px; height:14px; border-radius:3px; flex:none; border:1.5px solid var(--tenue); opacity:.7; }
.glifo.flow { border-radius:50%; } .glifo.sequence { border-style:dashed; } .glifo.er { border-radius:0; }

.lienzo-marco { grid-row:2; min-width:0; min-height:0; position:relative; overflow:hidden; }
.lienzo { position:absolute; inset:0; background:#f6f7f9; overflow:hidden; }
.lienzo.oscuro { background:#0c1a2e; }
.lienzo img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transition:opacity .25s; }
.migas { position:absolute; top:10px; left:10px; padding:4px 10px; font-size:12px; display:flex; gap:6px; align-items:center; }
.ctrl { position:absolute; right:10px; bottom:10px; display:flex; gap:2px; padding:3px; }
.ctrl button { border:0; background:transparent; color:inherit; font:inherit; padding:3px 8px; cursor:pointer; border-radius:var(--radio-s); }
.ctrl button:hover { background:var(--hover); }
.resalte { position:absolute; left:38%; top:34%; width:16%; height:22%; pointer-events:none; border-radius:10px; }

.codigo { font:12.5px/1.65 var(--mono); padding:8px 0; white-space:pre; counter-reset:l; }
.codigo div { padding:0 12px 0 46px; position:relative; }
.codigo div::before { counter-increment:l; content:counter(l); position:absolute; left:0; width:32px; text-align:right; color:var(--tenue); opacity:.6; }
.codigo .kw { color:var(--sint-kw); } .codigo .cm { color:var(--tenue); font-style:italic; } .codigo .id { color:var(--sint-id); }
.codigo .ondula { text-decoration:underline wavy var(--warn); text-underline-offset:3px; }
.codigo .l-issue { background:var(--warn-suave); }
.codigo .l-agente { background:var(--agente-suave); }
.archivos { display:flex; gap:2px; padding:6px 8px; font-size:12px; }
.archivos span { padding:2px 8px; cursor:pointer; color:var(--tenue); border-radius:var(--radio-s); }
.archivos span.sel { color:var(--texto); background:var(--sutil); }

.issue { margin:8px; padding:10px 12px; display:grid; gap:4px; }
.issue .cab { display:flex; gap:8px; align-items:center; font-size:11.5px; }
.issue code { font:11px var(--mono); }
.issue a, .kv a { color:var(--acento); text-decoration:none; font-family:var(--mono); font-size:11.5px; }
.issue .hint { color:var(--tenue); font-size:12px; }
.sev { width:8px; height:8px; border-radius:50%; flex:none; }
.boton { font:inherit; font-size:12px; cursor:pointer; padding:4px 10px; border:1px solid var(--borde); background:var(--superficie-alta); color:var(--texto); border-radius:var(--radio-s); justify-self:start; }
.boton:hover { background:var(--hover); }
.boton.prim { background:var(--acento); color:var(--acento-sobre); border-color:transparent; }
.boton.prim:hover { filter:brightness(1.08); }
.boton:focus-visible, .tab:focus-visible, .item:focus-visible { outline:2px solid var(--acento); outline-offset:2px; }

.kv { display:grid; grid-template-columns:96px 1fr; gap:8px 10px; padding:14px; font-size:12.5px; }
.kv b { color:var(--tenue); font-weight:400; }
.kv .tit { grid-column:1/-1; font-size:15px; font-weight:600; color:var(--texto-fuerte); display:flex; gap:8px; align-items:center; }
.chip { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--sutil); color:var(--tenue); }

.tema { margin:6px 8px; padding:8px; display:flex; gap:10px; align-items:center; cursor:pointer; }
.tema img { width:84px; height:44px; object-fit:cover; flex:none; }
.tema .ext { font-size:11px; color:var(--tenue); }
.paleta { display:flex; gap:3px; margin-top:4px; } .paleta i { width:11px; height:11px; border-radius:3px; display:block; box-shadow:inset 0 0 0 1px #0002; }
.pie-temas { padding:10px 12px; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--tenue); flex-wrap:wrap; }

.act { padding:8px 14px; font-size:12px; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; position:relative; }
.act .t { font:11px var(--mono); color:var(--tenue); }
.act .c { font:11.5px var(--mono); color:var(--agente-texto); }
.act .r { grid-column:2; color:var(--tenue); }
.act.nuevo { animation:entra .45s var(--curva) both; }
@keyframes entra { from { opacity:0; transform:translateY(-6px); background:var(--agente-suave);} to { opacity:1; transform:none; } }

.hist { padding:6px 14px; display:flex; gap:10px; align-items:center; font-size:12.5px; }
.hist .marca-h { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--tenue); flex:none; }
.hist.actual .marca-h { background:var(--acento); border-color:var(--acento); }
.hist.fut { opacity:.45; }

/* Paleta Ctrl+K */
.velo { position:fixed; inset:0; z-index:40; display:flex; justify-content:center; align-items:flex-start; padding-top:14vh; animation:aparece var(--dur) var(--curva); }
.dialogo { width:560px; max-width:92vw; overflow:hidden; animation:sube var(--dur) var(--curva); }
.dialogo input { width:100%; border:0; outline:0; background:transparent; color:var(--texto); font:inherit; font-size:15px; padding:14px 16px; }
.dialogo .res { padding:6px; max-height:300px; overflow:auto; }
.dialogo .r { padding:8px 10px; display:flex; gap:10px; align-items:center; cursor:pointer; border-radius:var(--radio-s); }
.dialogo .r.sel, .dialogo .r:hover { background:var(--sel); }
.dialogo .r small { margin-left:auto; color:var(--tenue); font:11px var(--mono); }
.dialogo .seccion { font-size:11px; color:var(--tenue); padding:8px 10px 4px; }
@keyframes aparece { from { opacity:0; } }
@keyframes sube { from { opacity:0; transform:translateY(8px) scale(.98); } }

/* Notas del prototipo (no son parte del diseno) */
.nota { position:fixed; right:12px; bottom:64px; z-index:60; width:340px; max-height:calc(100vh - 90px); overflow:auto; background:#111d; color:#eee; padding:10px 12px; border-radius:8px; font:12px/1.45 system-ui, sans-serif; backdrop-filter:blur(6px); }
.nota b { color:#fff; } .nota .s { display:block; margin-top:4px; cursor:pointer; padding:3px 8px; background:#ffffff14; border-radius:5px; }
.nota .s:hover { background:#ffffff28; }
.nota .min { float:right; cursor:pointer; opacity:.7; }
#conmutador { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:99; display:flex; align-items:center; gap:12px; background:#fff; color:#111; border-radius:999px; padding:6px 14px; box-shadow:0 6px 24px #000a; font:600 13px system-ui, sans-serif; }
#conmutador button { border:none; background:#111; color:#fff; border-radius:50%; width:26px; height:26px; cursor:pointer; }
#conmutador .modo { border-radius:99px; width:auto; padding:0 10px; background:#e8e8e8; color:#111; }

/* ======================= A: Neutro shadcn (zinc) =======================
   Lo que sale "de fabrica" de shadcn/ui: zinc, bordes de 1px, radios de 8, sombras minimas, Inter/sistema.
   Paneles pegados al lienzo con un borde; tabs como segmentado; foco con anillo. Agente en violeta discreto. */
[data-v="A"] {
  --fuente: "Inter", "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
  --tam:13px; --alto-barra:48px; --radio:8px; --radio-s:6px; --dur:.2s; --dur-corta:.15s; --curva:cubic-bezier(.2,.8,.2,1);
}
[data-v="A"][data-modo="claro"] { --fondo:#fff; --superficie:#fff; --superficie-alta:#fff; --texto:#18181b; --texto-fuerte:#09090b; --tenue:#71717a; --borde:#e4e4e7; --sutil:#f4f4f5; --sutil-2:#e4e4e7; --hover:#f4f4f5; --sel:#f4f4f5;
  --acento:#18181b; --acento-sobre:#fafafa; --agente:#7c3aed; --agente-texto:#6d28d9; --agente-suave:#7c3aed14; --agente-halo:#7c3aed55; --warn:#b45309; --warn-suave:#f59e0b18; --err:#dc2626; --sint-kw:#7c3aed; --sint-id:#0369a1; }
[data-v="A"][data-modo="oscuro"] { --fondo:#09090b; --superficie:#09090b; --superficie-alta:#18181b; --texto:#e4e4e7; --texto-fuerte:#fafafa; --tenue:#a1a1aa; --borde:#27272a; --sutil:#27272a; --sutil-2:#3f3f46; --hover:#18181b; --sel:#27272a;
  --acento:#fafafa; --acento-sobre:#09090b; --agente:#a78bfa; --agente-texto:#c4b5fd; --agente-suave:#a78bfa1f; --agente-halo:#a78bfa66; --warn:#fbbf24; --warn-suave:#fbbf241a; --err:#f87171; --sint-kw:#c4b5fd; --sint-id:#7dd3fc; }
[data-v="A"] .barra { border-bottom:1px solid var(--borde); }
[data-v="A"] .marca i { background:var(--texto); border-radius:5px; }
[data-v="A"] .busq { border:1px solid var(--borde); border-radius:var(--radio); background:var(--superficie); box-shadow:0 1px 2px #0000000d; }
[data-v="A"] kbd { border:1px solid var(--borde); border-radius:4px; background:var(--sutil); }
[data-v="A"] .panel { background:var(--superficie); }
[data-v="A"] .panel.izq { border-right:1px solid var(--borde); } [data-v="A"] .panel.der { border-left:1px solid var(--borde); }
[data-v="A"] .tabs { margin:8px; padding:3px; background:var(--sutil); border-radius:var(--radio); }
[data-v="A"] .tab { height:28px; border-radius:var(--radio-s); flex:1; justify-content:center; }
[data-v="A"] .tab.icono { flex:none; }
[data-v="A"] .tab.sel { background:var(--superficie-alta); box-shadow:0 1px 3px #0000001a, 0 0 0 1px var(--borde); }
[data-v="A"] .item { border-radius:var(--radio-s); }
[data-v="A"] .lienzo-marco { padding:0; }
[data-v="A"] .migas, [data-v="A"] .ctrl { background:var(--superficie-alta); color:var(--texto); border:1px solid var(--borde); border-radius:var(--radio); box-shadow:0 1px 3px #0000001a; }
[data-v="A"] .resalte { outline:2px solid var(--agente); outline-offset:3px; animation:pulso-a 1.6s infinite; }
@keyframes pulso-a { 50% { outline-offset:7px; outline-color:transparent; } }
[data-v="A"] .issue { border:1px solid var(--borde); border-radius:var(--radio); }
[data-v="A"] .tema { border:1px solid transparent; border-radius:var(--radio); } [data-v="A"] .tema:hover { background:var(--hover); }
[data-v="A"] .tema.sel { border-color:var(--texto); }
[data-v="A"] .tema img { border-radius:var(--radio-s); border:1px solid var(--borde); }
[data-v="A"] .act + .act { border-top:1px solid var(--borde); }
[data-v="A"] .velo { background:#00000059; }
[data-v="A"] .dialogo { background:var(--superficie-alta); border:1px solid var(--borde); border-radius:12px; box-shadow:0 16px 48px #00000030; }
[data-v="A"] .dialogo input { border-bottom:1px solid var(--borde); }
[data-v="A"] .oculta { border-right:1px solid var(--borde); } [data-v="A"] .oculta.der { border-left:1px solid var(--borde); border-right:0; }

/* ======================= B: Islas flotantes =======================
   El lienzo ocupa todo el fondo; las zonas son tarjetas separadas por un hueco, con radio grande, sombra
   suave y vidrio esmerilado. Profundidad por elevacion, no por bordes. Agente con halo y degradado. */
[data-v~="B"] {
  --fuente: "Inter", ui-sans-serif, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --tam:13px; --alto-barra:56px; --radio:14px; --radio-s:9px; --dur:.32s; --dur-corta:.18s; --curva:cubic-bezier(.32,.72,0,1);
}
[data-v~="B"][data-modo="claro"] { --fondo:#e9ecf2; --superficie:#ffffffd0; --superficie-alta:#ffffff; --texto:#1c2230; --texto-fuerte:#0b1020; --tenue:#6b7385; --borde:#dfe3ea; --sutil:#eef1f6; --sutil-2:#d5dae3; --hover:#0f172a0a; --sel:#3b5bfd14;
  --acento:#3b5bfd; --acento-sobre:#fff; --agente:#d946ef; --agente-texto:#a21caf; --agente-suave:#d946ef17; --agente-halo:#d946ef66; --warn:#c2410c; --warn-suave:#f9731618; --err:#e11d48; --sint-kw:#a21caf; --sint-id:#3b5bfd; --sombra:0 1px 1px #0b10200a, 0 8px 24px -6px #0b10201f; }
[data-v~="B"][data-modo="oscuro"] { --fondo:#0b0d12; --superficie:#171a22cc; --superficie-alta:#1f232d; --texto:#e3e6ee; --texto-fuerte:#fff; --tenue:#8a91a3; --borde:#ffffff12; --sutil:#ffffff0d; --sutil-2:#ffffff26; --hover:#ffffff0a; --sel:#6d8bff22;
  --acento:#7c95ff; --acento-sobre:#0b0d12; --agente:#e879f9; --agente-texto:#f0abfc; --agente-suave:#e879f91f; --agente-halo:#e879f977; --warn:#fdba74; --warn-suave:#fb923c1c; --err:#fb7185; --sint-kw:#f0abfc; --sint-id:#a5b4fc; --sombra:0 0 0 1px #ffffff0f, 0 12px 32px -8px #000c; }
[data-v~="B"].ui-chrome { padding:10px; gap:10px 0; }
[data-v~="B"] .lienzo-marco { grid-row:1/3; grid-column:1/-1; margin:-10px; z-index:0; }
[data-v~="B"] .barra, [data-v~="B"] .panel, [data-v~="B"] .oculta, [data-v~="B"] .asa { z-index:1; }
[data-v~="B"] .barra { background:var(--superficie); backdrop-filter:blur(18px) saturate(1.6); border-radius:var(--radio); box-shadow:var(--sombra); }
[data-v~="B"] .panel { background:var(--superficie); backdrop-filter:blur(18px) saturate(1.6); border-radius:var(--radio); box-shadow:var(--sombra); }
[data-v~="B"] .marca i { background:conic-gradient(from 200deg, var(--acento), var(--agente), var(--acento)); border-radius:6px; }
[data-v~="B"] .busq { background:var(--sutil); border-radius:99px; height:34px; }
[data-v~="B"] kbd { background:var(--superficie-alta); border-radius:5px; box-shadow:var(--sombra); }
[data-v~="B"] .tabs { padding:8px 8px 4px; }
[data-v~="B"] .tab { height:30px; border-radius:99px; }
[data-v~="B"] .tab.sel { background:var(--sel); color:var(--acento); }
[data-v~="B"] .item { border-radius:var(--radio-s); }
[data-v~="B"] .item.sel { color:var(--acento); }
[data-v~="B"] .asa::after { inset:20% 3px; }
[data-v~="B"] .oculta { background:var(--superficie); backdrop-filter:blur(18px); border-radius:var(--radio); box-shadow:var(--sombra); }
[data-v~="B"] .migas { top:auto; bottom:14px; left:50%; transform:translateX(-50%); }
[data-v~="B"] .migas, [data-v~="B"] .ctrl { background:var(--superficie); color:var(--texto); backdrop-filter:blur(18px); border-radius:99px; box-shadow:var(--sombra); }
[data-v~="B"] .ctrl { bottom:14px; right:auto; left:calc(50% + 180px); }
[data-v~="B"] .ctrl button { border-radius:99px; }
[data-v~="B"] .resalte { box-shadow:0 0 0 2px var(--agente), 0 0 32px 6px var(--agente-halo); animation:pulso-b 2s infinite; border-radius:14px; }
@keyframes pulso-b { 50% { box-shadow:0 0 0 2px var(--agente), 0 0 54px 14px transparent; } }
[data-v~="B"] .issue { background:var(--superficie-alta); border-radius:var(--radio-s); box-shadow:var(--sombra); }
[data-v~="B"] .tema { border-radius:var(--radio-s); } [data-v~="B"] .tema:hover { background:var(--hover); }
[data-v~="B"] .tema.sel { background:var(--sel); box-shadow:inset 0 0 0 1.5px var(--acento); }
[data-v~="B"] .tema img { border-radius:7px; box-shadow:var(--sombra); }
[data-v~="B"] .act { margin:4px 8px; border-radius:var(--radio-s); }
[data-v~="B"] .act:first-child { background:linear-gradient(90deg, var(--agente-suave), transparent); }
[data-v~="B"] .boton { border-radius:99px; border-color:var(--borde); }
[data-v~="B"] .velo { background:#0b10202e; backdrop-filter:blur(6px); }
[data-v~="B"] .dialogo { background:var(--superficie); backdrop-filter:blur(24px) saturate(1.6); border-radius:18px; box-shadow:var(--sombra), 0 30px 80px -20px #0006; }
[data-v~="B"] .dialogo input { font-size:16px; padding:18px 20px; }

/* ======================= C: Herramienta densa =======================

  `<div class="item${sel(v.id===est.vista)}${v.id===est.toca?' toca':''}" tabindex="0" data-vista="${v.id}"><span class="glifo ${t}"></span><span class="nom">${v.id}</span>${v.issues?`<span class="cnt warn">${v.issues}</span>`:''}${v.pasos?`<span class="cnt">${v.pasos} pasos</span>`:''}</div>`).join('')).join('');
const editor = () => `<div class="archivos"><span class="sel">vistas.dg</span><span>sistema.dg</span><span>temas/neon.dg</span></div><div class="codigo">${DG.map(([c,l]) => `<div class="${c==='issue'?'l-issue':c==='agente'?'l-agente':''}">${c==='cm'?'<span class="cm">'+l+'</span>':l}</div>`).join('')}</div>`;
const issues = () => ISSUES.map(i => `<div class="issue"><div class="cab"><span class="sev" style="background:var(--${i.sev})"></span><code>${i.cod}</code><span class="flex1"></span><a href="#">${i.sitio}</a></div><div>${i.msg}</div><div class="hint">${i.hint}</div>${i.fix?'<button class="boton">Aplicar fix</button>':''}</div>`).join('');
const detalle = () => `<div class="kv"><div class="tit">sesion.ses-sesion <span class="chip">modulo</span></div><b>Archivo</b><a href="#">sistema.dg:88</a><b>Fuente</b><span>packages/sesion/src/sesion.ts</span><b>Aristas</b><span>6 entrantes, 3 salientes</span><b>En Vistas</b><span>abierto, sesion-detalle, flujo-edicion</span><b>Pin</b><span>420, 180 (Vista sesion-detalle)</span></div>`;
const temas = () => TEMAS.map(([n,ext,p,img]) => `<div class="tema${sel(n===est.tema)}" data-tema="${n}"><img src="${IMG}temas/${img}.png"><div><div class="nomt">${n}</div><div class="ext">${ext?'extends '+ext:'base'}</div><div class="paleta">${p.map(c=>`<i style="background:${c}"></i>`).join('')}</div></div></div>`).join('') +
  `<div class="pie-temas">Previsualizando "${est.tema}" sin escribir <button class="boton prim">Fijar en abierto</button></div>`;
const historial = () => HIST.map(([k,t]) => `<div class="hist ${k}"><span class="marca-h"></span>${t}</div>`).join('') + '<div class="pie-temas"><button class="boton">Deshacer</button><button class="boton">Rehacer</button></div>';
const actividad = () => ACT.map(([t,c,r],i) => `<div class="act${i===0&&est.nuevo?' nuevo':''}"><span class="t">${t}</span><span class="c">diagrams ${c}</span><span class="r">${r}</span></div>`).join('');
const PANELES = { detalle:['Detalle', detalle], issues:['Issues <span class="cnt warn">3</span>', issues], temas:['Temas', temas], historial:['Historial', historial], agente:[()=>`Agente${est.nuevos?` <span class="cnt agente">${est.nuevos}</span>`:''}`, actividad] };
const titulo = k => typeof PANELES[k][0] === 'function' ? PANELES[k][0]() : PANELES[k][0];

// Color de fondo del Tema de cada captura, para que el lienzo no quede con franjas claras.
const FONDO_IMG = { bauhaus:'#efe8d8', blueprint:'#0d3b73', 'claro-suave':'#e6e7f8', editorial:'#fbf8f1', 'glass-chip':'#161440', keycaps:'#31333f', 'metro-map':'#ffffff', pcb:'#165137', 'soft-card':'#09090b', 'er-tienda':'#09090b', 'secuencia-tienda':'#09090b' };
function lienzo() {
  const v = actual(), clave = v.img.split('/')[1].replace('.png','');
  return `<div class="lienzo" style="background-color:${FONDO_IMG[clave]}"><img src="${IMG+v.img}">
    <div class="migas">paquetes &rsaquo; <b>${v.id}</b> <span class="chip">${v.tipo}</span><span class="chip">${est.tema}</span></div>
    ${est.resalte && est.vista===est.toca ? '<div class="resalte"></div>' : ''}
    <div class="ctrl"><button>&minus;</button><button>Ajustar</button><button>+</button>${v.pasos?'<button>&lsaquo; Paso 2/'+v.pasos+' &rsaquo;</button>':''}</div></div>`;
}
const cols = () => [est.verIzq?`${est.wIzq}px 6px`:'26px 6px', 'minmax(0,1fr)', est.verDer?`6px ${est.wDer}px`:'6px 26px'].join(' ');

let colsPrevias = null;
function pintar() {
  const ult = ACT[0];
  const destino = cols(), desde = colsPrevias || destino; colsPrevias = destino;
  const izq = `<div class="tabs">${[['vistas','Vistas'],['codigo','Codigo']].map(([k,n]) => `<span class="tab${sel(est.izq===k)}" tabindex="0" data-izq="${k}">${n}</span>`).join('')}<span class="flex1"></span><span class="tab icono" data-ocultar="izq" title="Ocultar (Ctrl+B)">&laquo;</span></div><div class="cuerpo">${est.izq==='codigo'?editor():indice()}</div>`;
  const der = `<div class="tabs">${Object.keys(PANELES).map(k => `<span class="tab${sel(est.der===k)}" tabindex="0" data-der="${k}">${titulo(k)}</span>`).join('')}<span class="flex1"></span><span class="tab icono" data-ocultar="der" title="Ocultar (Ctrl+J)">&raquo;</span></div><div class="cuerpo">${PANELES[est.der][1]()}</div>`;
  document.getElementById('raiz').innerHTML = `
  <div class="ui-chrome" data-v="${ATRIB[variante]||variante}" data-modo="${modo}" data-paleta="${paleta}" style="grid-template-columns:${desde}">
    <div class="barra"><span class="marca"><i></i>rinthel-arch</span>
      <div class="busq" data-buscar>Buscar Nodo, Vista o archivo:linea<kbd>Ctrl K</kbd></div><span class="flex1"></span>
      <span class="ultimo" data-der="agente"><span class="punto${est.siguiendo?' vivo':''}"></span>${est.nuevos?'+'+est.nuevos+' &middot; ':''}${ult[0]} diagrams ${ult[1]}</span>
      <span class="seguir${est.siguiendo?' on':''}" data-seguir><span class="interruptor"></span>Seguir al agente</span>
    </div>
    ${est.verIzq ? `<div class="panel izq c1${est.hIzq?' alto-fijo':''}"${est.hIzq?` style="height:${est.hIzq}px"`:''}>${izq}<div class="asa-v" data-asa-v="izq" title="Arrastra para cambiar el alto; doble clic lo devuelve al contenido"></div><div class="asa-d" data-asa-d="izq" title="Arrastra para cambiar ancho y alto"></div></div><div class="asa c2" data-asa="izq"></div>` : `<div class="oculta c1" data-mostrar="izq">Vistas | Codigo</div><div class="hueco c2"></div>`}
    <div class="lienzo-marco c3">${lienzo()}</div>
    ${est.verDer ? `<div class="asa c4" data-asa="der"></div><div class="panel der c5${est.hDer?' alto-fijo':''}"${est.hDer?` style="height:${est.hDer}px"`:''}>${der}<div class="asa-v" data-asa-v="der" title="Arrastra para cambiar el alto; doble clic lo devuelve al contenido"></div><div class="asa-d" data-asa-d="der" title="Arrastra para cambiar ancho y alto"></div></div>` : `<div class="hueco c4"></div><div class="oculta der c5" data-mostrar="der">Detalle | Issues | ...</div>`}
  </div>`;
  document.getElementById('dialogo').innerHTML = est.paleta ? `<div class="ui-chrome" data-v="${ATRIB[variante]||variante}" data-modo="${modo}" data-paleta="${paleta}" style="position:fixed;inset:0;background:transparent;display:block;z-index:40;pointer-events:none"><div class="velo" data-cerrar style="pointer-events:auto"><div class="dialogo"><input placeholder="Buscar Nodo, Vista o archivo:linea" autofocus><div class="res">
    <div class="seccion">Nodos</div><div class="r sel"><span class="glifo"></span>sesion.ses-sesion<small>sistema.dg:88</small></div><div class="r"><span class="glifo"></span>sesion.ses-historial<small>sistema.dg:97</small></div>
    <div class="seccion">Vistas</div><div class="r"><span class="glifo"></span>sesion-detalle<small>vistas.dg:41</small></div><div class="r"><span class="glifo flow"></span>flujo-edicion<small>vistas.dg:120</small></div></div></div></div></div>` : '';
  document.getElementById('etiqueta').textContent = variante === 'G' ? `G (Muelle) - paleta ${paleta}${modo==='claro'?' (claro: solo grafito)':''}` : `${variante} (${VARIANTES[variante]})`;
  document.getElementById('modo').textContent = modo === 'claro' ? 'Claro' : 'Oscuro';
  est.nuevo = false;
  if (desde !== destino) { const app = document.querySelector('#raiz .ui-chrome'); app.getBoundingClientRect(); requestAnimationFrame(() => { app.style.gridTemplateColumns = destino; }); }
  const di = document.querySelector('#dialogo input'); if (di) di.focus();
}

// ---------- Simulaciones ----------
const EVENTOS = {
  agente: ['Llega "diagrams edit pin" del agente', () => { ACT.unshift([new Date().toTimeString().slice(0,8),'edit pin sesion.ses-sesion 460,200','Vista sesion-detalle']); est.nuevo = true; est.resalte = true; if (est.der !== 'agente') est.nuevos++; if (est.siguiendo) est.vista = est.toca; }],
  nodo:   ['Clic en el Nodo sesion.ses-sesion', () => { est.der = 'detalle'; est.verDer = true; }],
  codigo: ['Doble clic en el Nodo (o E): abre el codigo', () => { est.izq = 'codigo'; est.verIzq = true; est.der = 'issues'; est.verDer = true; }],
  esc:    ['Esc: vuelve a Vistas', () => { est.izq = 'vistas'; }],
  paleta: ['Ctrl+K: paleta de busqueda', () => { est.paleta = true; }],
};
let notaMin = false; // en G se muestra para elegir paleta
function nota() {
  document.getElementById('nota').innerHTML = notaMin ? '<span class="min" data-nota>notas +</span>' :
    `<span class="min" data-nota>ocultar</span><b>${variante}. ${VARIANTES[variante]}</b><br>${({
      A:'Lo que da shadcn/ui casi de fabrica: zinc, bordes de 1px, radio 8, tabs segmentadas. Profundidad por bordes. Agente en violeta con anillo que pulsa.',
      B:'El lienzo llena la pantalla y las zonas flotan como islas de vidrio con sombra. Profundidad por elevacion, transiciones con resorte. Agente con halo.',
      C:'Editor de codigo moderno: oscuro, 12px, mono en lo tecnico, lineas finas y nada de sombras. Agente en cian con etiqueta en el lienzo. Movimiento minimo.',
      D:'Papel y tinta: serif en titulos y tabs, mucho aire, reglas finas. El lienzo enmarcado como una lamina. Agente en terracota con nota al margen.',
      E:'Estructura de B (lienzo a pantalla completa, islas de vidrio, resorte) con el alma de D: tinta calida, serif en titulos y pestanas subrayadas, agente terracota con halo y nota al margen.',
      F:'Estructura de D (chrome plano con reglas, lienzo como lamina) pero la lamina flota con radio y sombra larga, controles de vidrio, halo del agente y resorte de B.',
      G:'Islas de B que miden lo que su contenido (no todo el alto); la barra se parte en tres pildoras sueltas. Grafito frio, acento azul, agente coral. Mas lienzo a la vista.',
      H:'Vidrio pleno: aurora de color detras, desenfoque fuerte, radio 20, brillo interior arriba, acento en degradado violeta a cian. El lienzo tambien es una isla.',
      I:'Islas opacas sin vidrio: pizarra con borde interior nitido y sombra en capas, radio 10, 12.5px, pestanas subrayadas, acento verde azulado, agente rosa.',
      J:'Negro sobre negro; cada isla tiene un filo de 1px en degradado que se ilumina con el foco y en verde lima en la isla que toca el agente. Geist y mono en etiquetas.' })[variante]}
    ${variante==='G'?`<br><br><b>Paletas</b> (flechas o clic; todas en oscuro):<div class="paletas">${Object.entries(PALETAS).map(([n,c]) => `<span class="s${n===paleta?' sel':''}" data-paleta-sel="${n}">${[0,1,3,5,6].map(i=>`<i style="background:${c[i]}"></i>`).join('')}${n}</span>`).join('')}</div><br>Islas: arrastra el borde inferior (alto) o la esquina inferior (alto y ancho); doble clic en esas asas devuelve el alto al contenido.`:''}<br><br>Prueba: tabs, hover, Tab para foco, arrastrar bordes, Ctrl+B / Ctrl+J, boton Claro/Oscuro.<br>${Object.entries(EVENTOS).map(([k,[t]]) => `<span class="s" data-ev="${k}">${t}</span>`).join('')}`;
}

// ---------- Eventos ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-vista],[data-izq],[data-der],[data-ocultar],[data-mostrar],[data-tema],[data-seguir],[data-buscar],[data-ev],[data-nota],[data-cerrar],[data-paleta-sel]');
  if (!t) return;
  const d = t.dataset;
  if (d.vista) est.vista = d.vista;
  if (d.izq) est.izq = d.izq;
  if (d.der) { est.der = d.der; est.verDer = true; if (d.der === 'agente') est.nuevos = 0; }
  if (d.ocultar) est[d.ocultar === 'izq' ? 'verIzq' : 'verDer'] = false;
  if (d.mostrar) est[d.mostrar === 'izq' ? 'verIzq' : 'verDer'] = true;
  if (d.tema) est.tema = d.tema;
  if ('seguir' in d) est.siguiendo = !est.siguiendo;
  if ('buscar' in d) est.paleta = true;
  if ('cerrar' in d) { if (e.target.closest('.dialogo')) return; est.paleta = false; }
  if (d.ev) EVENTOS[d.ev][1]();
  if ('nota' in d) { notaMin = !notaMin; nota(); return; }
  if (d.paletaSel) { paleta = d.paletaSel; modo = 'oscuro'; url(); nota(); }
  pintar();
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (est.paleta) est.paleta = false; else est.izq = 'vistas'; pintar(); return; }
  if (e.ctrlKey && e.key === 'k') { est.paleta = true; e.preventDefault(); pintar(); return; }
  if (e.ctrlKey && e.key === 'b') { est.verIzq = !est.verIzq; e.preventDefault(); pintar(); return; }
  if (e.ctrlKey && e.key === 'j') { est.verDer = !est.verDer; e.preventDefault(); pintar(); return; }
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cambiar(-1); if (e.key === 'ArrowRight') cambiar(1);
  if (e.key === 'Enter' && e.target.dataset.vista) { est.vista = e.target.dataset.vista; pintar(); }
});
document.addEventListener('mousedown', e => {
  const vd = e.target.closest('[data-asa-v],[data-asa-d]'); if (!vd) return;
  e.preventDefault(); e.stopPropagation();
  const lado = vd.dataset.asaV || vd.dataset.asaD, diag = !!vd.dataset.asaD, panel = vd.parentElement, app = document.querySelector('#raiz .ui-chrome');
  const x0 = e.clientX, y0 = e.clientY, h0 = panel.offsetHeight, w0 = lado === 'izq' ? est.wIzq : est.wDer, hMax = app.querySelector('.lienzo-marco').offsetHeight - 30;
  app.style.transition = 'none'; panel.classList.add('alto-fijo');
  const kH = lado === 'izq' ? 'hIzq' : 'hDer', kW = lado === 'izq' ? 'wIzq' : 'wDer';
  const mover = ev => {
    est[kH] = Math.max(140, Math.min(hMax, h0 + ev.clientY - y0)); panel.style.height = est[kH] + 'px';
    if (diag) { const dx = ev.clientX - x0; est[kW] = Math.max(220, Math.min(760, lado === 'izq' ? w0 + dx : w0 - dx)); app.style.gridTemplateColumns = colsPrevias = cols(); }
  };
  addEventListener('mousemove', mover);
  addEventListener('mouseup', () => { removeEventListener('mousemove', mover); pintar(); }, { once:true });
}, true);
document.addEventListener('dblclick', e => { const vd = e.target.closest('[data-asa-v],[data-asa-d]'); if (!vd) return; est[(vd.dataset.asaV || vd.dataset.asaD) === 'izq' ? 'hIzq' : 'hDer'] = null; pintar(); });
document.addEventListener('mousedown', e => {
  const asa = e.target.closest('[data-asa]'); if (!asa) return;
  e.preventDefault();
  const lado = asa.dataset.asa, x0 = e.clientX, w0 = lado === 'izq' ? est.wIzq : est.wDer, app = document.querySelector('#raiz .ui-chrome');
  app.style.transition = 'none';
  const mover = ev => { const dx = ev.clientX - x0, w = Math.max(220, Math.min(640, lado === 'izq' ? w0 + dx : w0 - dx)); if (lado === 'izq') est.wIzq = w; else est.wDer = w; app.style.gridTemplateColumns = colsPrevias = cols(); };
  addEventListener('mousemove', mover);
  addEventListener('mouseup', () => { removeEventListener('mousemove', mover); pintar(); }, { once:true });
});
function url() { const u = new URL(location); u.searchParams.set('variant', variante); u.searchParams.set('modo', modo); u.searchParams.set('paleta', paleta); history.replaceState(null, '', u); }
function cambiarPaleta(d) { paleta = nombresPal[(nombresPal.indexOf(paleta) + d + nombresPal.length) % nombresPal.length]; modo = 'oscuro'; url(); pintar(); nota(); }
function cambiar(d) { if (variante === 'G') return cambiarPaleta(d); variante = claves[(claves.indexOf(variante) + d + claves.length) % claves.length]; modo = MODO_DEF[variante]; url(); pintar(); nota(); }
document.getElementById('prev').onclick = () => cambiar(-1);
document.getElementById('next').onclick = () => cambiar(1);
document.getElementById('modo').onclick = () => { modo = modo === 'claro' ? 'oscuro' : 'claro'; url(); pintar(); };
pintar(); nota();
</script>
</body>
</html>
